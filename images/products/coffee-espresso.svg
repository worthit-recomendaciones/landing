<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="es-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#315CF5" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#C7F36B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00111c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="es-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70829c"/>
      <stop offset="35%" stop-color="#3c485c"/>
      <stop offset="70%" stop-color="#232d3b"/>
      <stop offset="100%" stop-color="#121720"/>
    </linearGradient>
    <linearGradient id="es-chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6e0f0"/>
      <stop offset="50%" stop-color="#8093b0"/>
      <stop offset="100%" stop-color="#3b4859"/>
    </linearGradient>
    <filter id="es-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="transparent"/>
  <ellipse cx="200" cy="220" rx="140" ry="120" fill="url(#es-glow)"/>

  <g filter="url(#es-shadow)">
    <!-- Main Stainless Steel Chassis Body -->
    <rect x="110" y="80" width="180" height="230" rx="14" fill="url(#es-metal)" stroke="#4d5f7a" stroke-width="2.5"/>

    <!-- Top Cup Warming Tray Railing -->
    <rect x="115" y="70" width="170" height="12" rx="3" fill="#1b2330" stroke="#374558" stroke-width="1.5"/>
    <!-- Tiny ceramic cups on top warming tray -->
    <path d="M 135 70 L 138 60 L 152 60 L 155 70 Z" fill="#e2ebf5"/>
    <path d="M 165 70 L 168 60 L 182 60 L 185 70 Z" fill="#e2ebf5"/>

    <!-- Front Digital Touch Control Display Panel -->
    <rect x="125" y="95" width="150" height="50" rx="8" fill="#080c13" stroke="#253245" stroke-width="1.8"/>

    <!-- Touch Display Interface Screen -->
    <rect x="140" y="102" width="120" height="36" rx="4" fill="#0d1420" stroke="#315CF5" stroke-width="1.2"/>
    <text x="150" y="122" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#C7F36B">ESPRESSO</text>
    <text x="150" y="133" font-family="'Segoe UI', sans-serif" font-size="8" fill="#889ab8">DOUBLE SHOT • 93°C</text>
    <circle cx="242" cy="120" r="10" fill="#315CF5"/>
    <polygon points="240,116 246,120 240,124" fill="#ffffff"/>

    <!-- Commercial Group Head Collar -->
    <rect x="165" y="155" width="70" height="20" rx="4" fill="#141a24" stroke="#3b4b63" stroke-width="2"/>
    <rect x="175" y="175" width="50" height="8" rx="2" fill="url(#es-chrome)"/>

    <!-- Heavy Portafilter Handle (Angled forward) -->
    <g transform="translate(190, 180) rotate(-15)">
      <rect x="0" y="-8" width="30" height="16" rx="6" fill="url(#es-chrome)"/>
      <path d="M 28 -4 L 85 -7 L 85 7 L 28 4 Z" fill="#0b0e14" stroke="#263242" stroke-width="1.5"/>
      <circle cx="85" cy="0" r="7" fill="#0b0e14" stroke="#C7F36B" stroke-width="1.5"/>
      <!-- Dual Pour Spouts -->
      <polygon points="10,8 14,18 18,18 14,8" fill="url(#es-chrome)"/>
    </g>

    <!-- Professional Steam Wand (Left side) -->
    <path d="M 125 160 L 115 190 L 125 220" fill="none" stroke="url(#es-chrome)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="125" cy="220" r="4.5" fill="#C7F36B"/>

    <!-- Dual-Spout Espresso Cup on Drip Grid -->
    <path d="M 180 230 L 184 255 Q 200 258 216 255 L 220 230 Z" fill="#f0f4fa" stroke="#c0d0e6" stroke-width="1.5"/>
    <path d="M 218 236 Q 228 242 216 248" fill="none" stroke="#c0d0e6" stroke-width="2"/>
    <!-- Crema in cup -->
    <ellipse cx="200" cy="232" rx="17" ry="5" fill="#a46429"/>

    <!-- Slotted Metal Drip Tray Grid -->
    <rect x="120" y="260" width="160" height="30" rx="6" fill="#151b24" stroke="#334257" stroke-width="1.5"/>
    <line x1="130" y1="268" x2="270" y2="268" stroke="#3d4f68" stroke-width="2"/>
    <line x1="130" y1="274" x2="270" y2="274" stroke="#3d4f68" stroke-width="2"/>
    <line x1="130" y1="280" x2="270" y2="280" stroke="#3d4f68" stroke-width="2"/>

    <!-- Heavy Cast Aluminum Feet -->
    <rect x="125" y="290" width="25" height="12" rx="3" fill="#080c13"/>
    <rect x="250" y="290" width="25" height="12" rx="3" fill="#080c13"/>
  </g>
</svg>