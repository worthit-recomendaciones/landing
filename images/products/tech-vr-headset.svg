<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="vr-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#315CF5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C7F36B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00111c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vr-visor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2736"/>
      <stop offset="50%" stop-color="#0d131c"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="vr-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a384e"/>
      <stop offset="100%" stop-color="#101724"/>
    </linearGradient>
    <filter id="vr-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="transparent"/>
  <ellipse cx="200" cy="200" rx="140" ry="120" fill="url(#vr-glow)"/>

  <g filter="url(#vr-shadow)" transform="rotate(-6, 200, 200)">
    <!-- Headband rear halo -->
    <path d="M 90 190 C 70 140, 110 90, 200 90 C 290 90, 330 140, 310 190" 
          fill="none" stroke="#161e2b" stroke-width="20" stroke-linecap="round"/>
    <!-- Top central strap -->
    <path d="M 200 90 C 200 130, 200 150, 200 170" 
          fill="none" stroke="#222d3d" stroke-width="16" stroke-linecap="round"/>

    <!-- Soft face foam cushion -->
    <rect x="95" y="165" width="210" height="85" rx="28" fill="#090d14"/>

    <!-- Main VR HMD Visor Enclosure -->
    <rect x="105" y="170" width="190" height="90" rx="24" fill="url(#vr-visor)" stroke="#303f56" stroke-width="2.5"/>

    <!-- Front Glossy Mirror Shield -->
    <path d="M 120 180 Q 200 190 280 180 Q 284 225 275 240 Q 200 250 125 240 Q 116 225 120 180 Z" 
          fill="url(#vr-face)" stroke="#315CF5" stroke-width="1.5"/>

    <!-- Ambient light glow slash on glass -->
    <path d="M 135 185 L 210 185 L 180 235 L 125 235 Z" fill="#ffffff" opacity="0.08"/>

    <!-- Tracking cameras (4 optical sensor dots) -->
    <circle cx="128" cy="188" r="4.5" fill="#0b0f17" stroke="#315CF5" stroke-width="1.5"/>
    <circle cx="128" cy="188" r="1.5" fill="#C7F36B"/>

    <circle cx="272" cy="188" r="4.5" fill="#0b0f17" stroke="#315CF5" stroke-width="1.5"/>
    <circle cx="272" cy="188" r="1.5" fill="#C7F36B"/>

    <circle cx="132" cy="235" r="4" fill="#0b0f17" stroke="#315CF5" stroke-width="1"/>
    <circle cx="268" cy="235" r="4" fill="#0b0f17" stroke="#315CF5" stroke-width="1"/>

    <!-- Neon Horizon LED Lightstrip -->
    <path d="M 150 215 Q 200 220 250 215" fill="none" stroke="#C7F36B" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>