<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sw-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C7F36B" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#315CF5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00111c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sw-strap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#559187"/>
      <stop offset="50%" stop-color="#80beaf"/>
      <stop offset="100%" stop-color="#497c73"/>
    </linearGradient>
    <linearGradient id="sw-case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3545"/>
      <stop offset="50%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>
    <filter id="sw-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="transparent"/>
  <ellipse cx="200" cy="200" rx="130" ry="130" fill="url(#sw-glow)"/>

  <!-- Straps -->
  <g filter="url(#sw-shadow)">
    <!-- Top strap -->
    <path d="M 160 30 L 240 30 L 234 140 L 166 140 Z" fill="url(#sw-strap)"/>
    <!-- Top strap stitch & pin holes -->
    <line x1="200" y1="45" x2="200" y2="55" stroke="#355e56" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="70" x2="200" y2="80" stroke="#355e56" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="95" x2="200" y2="105" stroke="#355e56" stroke-width="3" stroke-linecap="round"/>

    <!-- Bottom strap -->
    <path d="M 166 260 L 234 260 L 240 370 L 160 370 Z" fill="url(#sw-strap)"/>
    <rect x="175" y="325" width="50" height="12" rx="3" fill="#3a6960" opacity="0.6"/>

    <!-- Digital Crown Button on right -->
    <rect x="254" y="172" width="10" height="26" rx="3" fill="#ff7a45"/>
    <rect x="254" y="212" width="6" height="18" rx="2" fill="#7a889b"/>

    <!-- Watch Body (Curved Squircle) -->
    <rect x="142" y="132" width="116" height="136" rx="30" fill="url(#sw-case)" stroke="#3e4a5e" stroke-width="3.5"/>
    
    <!-- Screen Bezel -->
    <rect x="152" y="142" width="96" height="116" rx="22" fill="#030508" stroke="#18202c" stroke-width="1.5"/>

    <!-- Screen Glass Highlight -->
    <path d="M 156 150 Q 200 144 242 165 L 242 175 Q 195 155 156 160 Z" fill="#ffffff" opacity="0.12"/>

    <!-- Digital Watchface Display (09:15 like reference) -->
    <text x="200" y="186" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ff7a45" letter-spacing="1">09</text>
    <text x="200" y="222" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ff7a45" letter-spacing="1">15</text>

    <!-- Activity stats at bottom -->
    <circle cx="178" cy="242" r="4.5" fill="#C7F36B"/>
    <text x="186" y="246" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#C7F36B">124</text>
    
    <circle cx="218" cy="242" r="4.5" fill="#315CF5"/>
    <text x="226" y="246" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#315CF5">98%</text>
  </g>
</svg>