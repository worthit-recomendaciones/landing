<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="lb-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#C7F36B" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#00111c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d4a5e"/>
      <stop offset="50%" stop-color="#1e2633"/>
      <stop offset="100%" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="lb-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff2c2" stop-opacity="0"/>
    </linearGradient>
    <filter id="lb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="transparent"/>
  <ellipse cx="200" cy="180" rx="150" ry="140" fill="url(#lb-glow)"/>

  <!-- Light Cone projection downwards onto desk -->
  <polygon points="70,140 330,140 380,330 20,330" fill="url(#lb-beam)"/>

  <g filter="url(#lb-shadow)">
    <!-- Monitor Top Bezel Reference (Ghost silhouette) -->
    <path d="M 80 190 Q 200 178 320 190 L 320 280 Q 200 268 80 280 Z" 
          fill="#0c121c" stroke="#253245" stroke-width="2" opacity="0.8"/>
    <!-- Screen display subtle glow -->
    <path d="M 90 198 Q 200 188 310 198 L 310 270 Q 200 260 90 270 Z" 
          fill="#131c2c" opacity="0.7"/>

    <!-- Counterweight Heavy Hinge Mount on monitor top -->
    <path d="M 182 135 L 218 135 L 214 175 C 214 185, 186 185, 186 175 Z" 
          fill="#101722" stroke="#2f3d52" stroke-width="2"/>
    <!-- Counterweight Ball rear -->
    <circle cx="200" cy="178" r="14" fill="#080c14" stroke="#315CF5" stroke-width="1.5"/>

    <!-- Main Aluminum Cylindrical Light Bar -->
    <rect x="50" y="128" width="300" height="15" rx="7.5" fill="url(#lb-metal)" stroke="#4d5f78" stroke-width="1.8"/>

    <!-- Front LED Optical Diffuser Strip -->
    <rect x="58" y="138" width="284" height="4" rx="2" fill="#fff7d6"/>

    <!-- Ambient Backlight Halo on top rear of bar -->
    <ellipse cx="200" cy="128" rx="70" ry="4" fill="#C7F36B" opacity="0.85"/>

    <!-- Center Light Sensor / Touch Button -->
    <circle cx="200" cy="135" r="3.5" fill="#315CF5"/>
    <circle cx="200" cy="135" r="1.5" fill="#C7F36B"/>

    <!-- Wireless Desktop Controller Puck Dial (Foreground right) -->
    <g transform="translate(280, 290)">
      <ellipse cx="0" cy="20" rx="38" ry="16" fill="#06090e" stroke="#1d2634" stroke-width="1.5"/>
      <ellipse cx="0" cy="12" rx="36" ry="15" fill="#141c27"/>
      <!-- Knurled Rotary Dial Outer Ring -->
      <ellipse cx="0" cy="8" rx="34" ry="14" fill="url(#lb-metal)" stroke="#3f516d" stroke-width="1.5"/>
      <!-- Glowing status halo ring on dial -->
      <ellipse cx="0" cy="8" rx="25" ry="10" fill="none" stroke="#C7F36B" stroke-width="2"/>
      <circle cx="0" cy="8" r="6" fill="#315CF5"/>
    </g>
  </g>
</svg>