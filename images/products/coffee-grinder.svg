<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="cg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C7F36B" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#315CF5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00111c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cg-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a3342"/>
      <stop offset="50%" stop-color="#141a23"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="cg-hopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e6587" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#182333" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="cg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="transparent"/>
  <ellipse cx="200" cy="220" rx="140" ry="120" fill="url(#cg-glow)"/>

  <g filter="url(#cg-shadow)">
    <!-- Base Plate -->
    <rect x="130" y="325" width="140" height="18" rx="6" fill="#0c1118" stroke="#253245" stroke-width="1.8"/>

    <!-- Slanted Modern Grinder Chassis Body (64-degree tilt angle) -->
    <polygon points="155,325 215,325 235,160 175,160" fill="url(#cg-body)" stroke="#394961" stroke-width="2"/>

    <!-- Stepless Grind Adjustment Knurled Ring -->
    <ellipse cx="205" cy="160" rx="38" ry="14" fill="#182230" stroke="#C7F36B" stroke-width="2"/>
    <ellipse cx="205" cy="156" rx="36" ry="12" fill="#29394f"/>
    <!-- Grind Dial Markings -->
    <line x1="180" y1="156" x2="183" y2="156" stroke="#ffffff" stroke-width="2"/>
    <line x1="190" y1="156" x2="193" y2="156" stroke="#ffffff" stroke-width="2"/>
    <line x1="205" y1="156" x2="205" y2="153" stroke="#C7F36B" stroke-width="2.5"/>
    <line x1="217" y1="156" x2="220" y2="156" stroke="#ffffff" stroke-width="2"/>
    <line x1="227" y1="156" x2="230" y2="156" stroke="#ffffff" stroke-width="2"/>

    <!-- Tinted Bean Hopper (Upper Funnel) -->
    <polygon points="175,150 235,150 250,70 160,70" fill="url(#cg-hopper)" stroke="#4d678c" stroke-width="1.8"/>
    <!-- Walnut Wooden Hopper Lid -->
    <ellipse cx="205" cy="70" rx="46" ry="14" fill="#7a4e28" stroke="#a66e3e" stroke-width="2"/>
    <circle cx="205" cy="65" r="5" fill="#315CF5"/>

    <!-- Coffee beans inside hopper silhouette -->
    <ellipse cx="195" cy="110" rx="8" ry="5" fill="#38210f" transform="rotate(25, 195, 110)"/>
    <ellipse cx="215" cy="120" rx="8" ry="5" fill="#442913" transform="rotate(-30, 215, 120)"/>
    <ellipse cx="190" cy="130" rx="8" ry="5" fill="#38210f" transform="rotate(10, 190, 130)"/>
    <ellipse cx="210" cy="100" rx="8" ry="5" fill="#442913" transform="rotate(-15, 210, 100)"/>

    <!-- Precision Chute with Ionizer Needle -->
    <polygon points="165,225 150,245 160,250 172,230" fill="#0d141e" stroke="#315CF5" stroke-width="1.5"/>

    <!-- Magnetic Stainless Steel Grounds Catch Cup -->
    <rect x="135" y="240" width="50" height="85" rx="10" fill="#1c2534" stroke="#485d7d" stroke-width="2"/>
    <ellipse cx="160" cy="242" rx="24" ry="8" fill="#2d3c52"/>
    <rect x="145" y="270" width="30" height="2" fill="#C7F36B" opacity="0.6"/>

    <!-- Power Pushbutton Switch on Side -->
    <circle cx="212" cy="290" r="12" fill="#090d14" stroke="#315CF5" stroke-width="2"/>
    <circle cx="212" cy="290" r="6" fill="#C7F36B"/>
  </g>
</svg>