<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="oc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#315CF5" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#C7F36B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00111c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oc-mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3547"/>
      <stop offset="50%" stop-color="#161e2b"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="oc-spine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5f82"/>
      <stop offset="50%" stop-color="#243144"/>
      <stop offset="100%" stop-color="#121822"/>
    </linearGradient>
    <filter id="oc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="transparent"/>
  <ellipse cx="200" cy="220" rx="140" ry="130" fill="url(#oc-glow)"/>

  <g filter="url(#oc-shadow)">
    <!-- Base 5-Star Legs -->
    <path d="M 200 325 L 125 360 M 200 325 L 275 360 M 200 325 L 200 365 M 200 325 L 150 345 M 200 325 L 250 345" 
          stroke="#263449" stroke-width="8" stroke-linecap="round"/>
    <!-- Casters (Wheels) -->
    <circle cx="125" cy="360" r="7" fill="#0c111a" stroke="#315CF5" stroke-width="2"/>
    <circle cx="275" cy="360" r="7" fill="#0c111a" stroke="#315CF5" stroke-width="2"/>
    <circle cx="200" cy="365" r="7" fill="#0c111a" stroke="#315CF5" stroke-width="2"/>

    <!-- Central Gas Cylinder Column -->
    <rect x="193" y="270" width="14" height="58" rx="4" fill="url(#oc-spine)" stroke="#3e4e68" stroke-width="1"/>
    <!-- Tension adjustment knob -->
    <circle cx="200" cy="275" r="5" fill="#C7F36B"/>

    <!-- Ergonomic Seat Pan (Thick High-Density Molded Cushion) -->
    <path d="M 130 240 Q 200 248 270 240 Q 265 268 200 270 Q 135 268 130 240 Z" 
          fill="url(#oc-mesh)" stroke="#3d4f6b" stroke-width="2"/>

    <!-- Lumbar Spine Support Spine Frame Behind Back -->
    <path d="M 200 110 L 200 245" stroke="url(#oc-spine)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 155 190 Q 200 210 245 190" stroke="#C7F36B" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

    <!-- Breathable Mesh Backrest Contoured Shell -->
    <path d="M 145 105 Q 200 95 255 105 Q 250 220 200 226 Q 150 220 145 105 Z" 
          fill="url(#oc-mesh)" stroke="#33435c" stroke-width="2" opacity="0.95"/>
    <!-- Inner Breathable Mesh Ribs -->
    <path d="M 160 130 Q 200 125 240 130" stroke="#3b4d6b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 158 155 Q 200 150 242 155" stroke="#3b4d6b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 162 180 Q 200 175 238 180" stroke="#3b4d6b" stroke-width="2" stroke-linecap="round"/>

    <!-- Ergonomic Headrest -->
    <path d="M 170 58 Q 200 52 230 58 Q 228 85 200 87 Q 172 85 170 58 Z" 
          fill="url(#oc-mesh)" stroke="#3e4e68" stroke-width="2"/>
    <line x1="200" y1="87" x2="200" y2="105" stroke="#2a374b" stroke-width="6"/>

    <!-- 4D Armrests (Left & Right) -->
    <path d="M 135 245 L 118 205 L 138 200" fill="none" stroke="#253245" stroke-width="6" stroke-linecap="round"/>
    <rect x="110" y="194" width="36" height="10" rx="4" fill="#0d121c" stroke="#315CF5" stroke-width="1.5"/>

    <path d="M 265 245 L 282 205 L 262 200" fill="none" stroke="#253245" stroke-width="6" stroke-linecap="round"/>
    <rect x="254" y="194" width="36" height="10" rx="4" fill="#0d121c" stroke="#315CF5" stroke-width="1.5"/>
  </g>
</svg>