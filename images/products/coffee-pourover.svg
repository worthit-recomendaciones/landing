<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="po-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C7F36B" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#315CF5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00111c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="po-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e8bb5" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2a3a52" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#141d2a" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="po-coffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#693c18"/>
      <stop offset="60%" stop-color="#381d08"/>
      <stop offset="100%" stop-color="#1c0c02"/>
    </linearGradient>
    <filter id="po-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="transparent"/>
  <ellipse cx="200" cy="220" rx="140" ry="120" fill="url(#po-glow)"/>

  <g filter="url(#po-shadow)">
    <!-- Hourglass Glass Carafe Body (Cone top + Erlenmeyer base) -->
    <!-- Lower brewed coffee volume -->
    <path d="M 175 220 L 120 330 Q 200 350 280 330 L 225 220 Z" fill="url(#po-coffee)"/>
    <ellipse cx="200" cy="220" rx="25" ry="6" fill="#8f5221"/>

    <!-- Clear Borosilicate Glass Outer Shell -->
    <path d="M 140 70 L 175 185 L 175 210 L 110 340 Q 200 360 290 340 L 225 210 L 225 185 L 260 70 Z" 
          fill="url(#po-glass)" stroke="#88aedc" stroke-width="2.5"/>

    <!-- Top Spout Lip -->
    <ellipse cx="200" cy="70" rx="60" ry="16" fill="none" stroke="#b0d0fa" stroke-width="2"/>
    <path d="M 136 70 C 130 65, 128 75, 134 80" fill="none" stroke="#b0d0fa" stroke-width="2"/>

    <!-- Natural Polished Wood Collar at the waist -->
    <path d="M 166 182 L 234 182 L 238 218 L 162 218 Z" fill="#9e6635" stroke="#c98a4f" stroke-width="2"/>
    <!-- Wood grain details -->
    <line x1="164" y1="194" x2="236" y2="194" stroke="#70441d" stroke-width="1.5"/>
    <line x1="163" y1="206" x2="237" y2="206" stroke="#70441d" stroke-width="1.5"/>

    <!-- Genuine Leather Tie Strap with Wooden Bead -->
    <rect x="160" y="196" width="80" height="6" rx="2" fill="#38210f"/>
    <!-- Hanging cord strands -->
    <path d="M 200 202 L 195 240" stroke="#38210f" stroke-width="3" stroke-linecap="round"/>
    <path d="M 203 202 L 208 245" stroke="#38210f" stroke-width="3" stroke-linecap="round"/>
    <!-- Wooden bead slider -->
    <circle cx="200" cy="216" r="6" fill="#c98a4f" stroke="#e0aa6d" stroke-width="1.5"/>
    <circle cx="200" cy="216" r="2" fill="#000000"/>

    <!-- Glass Level Button Mark (Raised Glass Pip indicator) -->
    <circle cx="200" cy="280" r="5" fill="#C7F36B" opacity="0.8"/>

    <!-- Paper Filter Cone sitting in top funnel -->
    <polygon points="146,75 254,75 200,175" fill="#fcf6e8" opacity="0.85" stroke="#e0d4be" stroke-width="1.5"/>
    <!-- Ground artisan coffee bed inside filter -->
    <polygon points="160,110 240,110 200,170" fill="#381f0d"/>
    <ellipse cx="200" cy="110" rx="40" ry="10" fill="#4d2b12"/>
    <!-- Golden bloom swirl on coffee bed -->
    <ellipse cx="200" cy="110" rx="25" ry="6" fill="#874e22" opacity="0.8"/>

    <!-- Glass Reflection Highlights -->
    <path d="M 125 320 L 165 230" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <path d="M 275 320 L 235 230" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.15"/>
  </g>
</svg>