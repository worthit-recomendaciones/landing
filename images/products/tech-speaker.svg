<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="spk-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#315CF5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00111c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00111c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spk-mesh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="25%" stop-color="#283347"/>
      <stop offset="60%" stop-color="#18202d"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="spk-ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C7F36B"/>
      <stop offset="50%" stop-color="#315CF5"/>
      <stop offset="100%" stop-color="#C7F36B"/>
    </linearGradient>
    <pattern id="spk-dots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="#3b485e" opacity="0.5"/>
    </pattern>
    <filter id="spk-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="transparent"/>
  <ellipse cx="200" cy="220" rx="140" ry="130" fill="url(#spk-glow)"/>

  <!-- Audio dispersion waves (left and right, just like reference 1) -->
  <g opacity="0.5">
    <path d="M 120 180 C 105 190, 105 210, 120 220" fill="none" stroke="#315CF5" stroke-width="2"/>
    <path d="M 100 165 C 80 185, 80 215, 100 235" fill="none" stroke="#315CF5" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 80 150 C 55 180, 55 220, 80 250" fill="none" stroke="#C7F36B" stroke-width="2" stroke-dasharray="2 6"/>

    <path d="M 280 180 C 295 190, 295 210, 280 220" fill="none" stroke="#315CF5" stroke-width="2"/>
    <path d="M 300 165 C 320 185, 320 215, 300 235" fill="none" stroke="#315CF5" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 320 150 C 345 180, 345 220, 320 250" fill="none" stroke="#C7F36B" stroke-width="2" stroke-dasharray="2 6"/>
  </g>

  <!-- Speaker Body Cylinder -->
  <g filter="url(#spk-shadow)">
    <!-- Base shadow stand -->
    <ellipse cx="200" cy="315" rx="58" ry="16" fill="#040609"/>

    <!-- Cylindrical Lower Body -->
    <path d="M 148 135 L 142 300 C 142 316, 258 316, 258 300 L 252 135 Z" fill="url(#spk-mesh)"/>
    <!-- Mesh pattern overlay -->
    <path d="M 148 135 L 142 300 C 142 316, 258 316, 258 300 L 252 135 Z" fill="url(#spk-dots)"/>

    <!-- Cylinder Top Cap Edge -->
    <ellipse cx="200" cy="135" rx="52" ry="20" fill="#0c1017" stroke="#38475f" stroke-width="2"/>

    <!-- Glowing Smart Control Ring -->
    <ellipse cx="200" cy="133" rx="46" ry="16" fill="none" stroke="url(#spk-ring)" stroke-width="4"/>

    <!-- Central Top Touch Disc -->
    <ellipse cx="200" cy="132" rx="36" ry="12" fill="#151b26"/>

    <!-- Top Touch Controls (Mic & Volume) -->
    <circle cx="185" cy="132" r="2.5" fill="#C7F36B"/>
    <circle cx="215" cy="132" r="2.5" fill="#315CF5"/>
    <circle cx="200" cy="132" r="3" fill="#ffffff"/>

    <!-- Front Power Button / Ambient status icon (like reference 1) -->
    <circle cx="200" cy="278" r="10" fill="#090d14" stroke="#253245" stroke-width="1.5"/>
    <!-- Power Glyph -->
    <path d="M 197 274 C 195 275.5, 194.5 278, 196 280.5 C 197.5 282.5, 202.5 282.5, 204 280.5 C 205.5 278, 205 275.5, 203 274" 
          fill="none" stroke="#C7F36B" stroke-width="2" stroke-linecap="round"/>
    <line x1="200" y1="272" x2="200" y2="277" stroke="#C7F36B" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>