<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ph-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#315CF5" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#00111c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00111c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ph-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#233558"/>
      <stop offset="35%" stop-color="#14213d"/>
      <stop offset="70%" stop-color="#0d1628"/>
      <stop offset="100%" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="ph-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5177"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <filter id="ph-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="transparent"/>
  <ellipse cx="200" cy="200" rx="130" ry="140" fill="url(#ph-glow)"/>

  <g filter="url(#ph-shadow)">
    <!-- Smartphone Chassis Backplate -->
    <rect x="140" y="55" width="120" height="290" rx="28" fill="url(#ph-body)" stroke="#3a4f78" stroke-width="2.5"/>

    <!-- Subtle edge antenna bands -->
    <line x1="139" y1="95" x2="141" y2="95" stroke="#48608e" stroke-width="2"/>
    <line x1="139" y1="305" x2="141" y2="305" stroke="#48608e" stroke-width="2"/>
    <line x1="259" y1="95" x2="261" y2="95" stroke="#48608e" stroke-width="2"/>
    <line x1="259" y1="305" x2="261" y2="305" stroke="#48608e" stroke-width="2"/>

    <!-- Camera Plateau Island (Rounded Glass Squircle) -->
    <rect x="148" y="65" width="56" height="64" rx="16" fill="#182743" stroke="#2e4268" stroke-width="1.5"/>

    <!-- Lens 1 (Top Left) -->
    <circle cx="166" cy="84" r="11" fill="url(#ph-lens)" stroke="#455b85" stroke-width="1.5"/>
    <circle cx="166" cy="84" r="7" fill="#06090f"/>
    <circle cx="164" cy="82" r="2.5" fill="#315CF5" opacity="0.8"/>
    <circle cx="165" cy="83" r="1" fill="#C7F36B"/>

    <!-- Lens 2 (Bottom Left) -->
    <circle cx="166" cy="110" r="11" fill="url(#ph-lens)" stroke="#455b85" stroke-width="1.5"/>
    <circle cx="166" cy="110" r="7" fill="#06090f"/>
    <circle cx="164" cy="108" r="2.5" fill="#315CF5" opacity="0.8"/>
    <circle cx="165" cy="109" r="1" fill="#C7F36B"/>

    <!-- Lens 3 (Right Center) -->
    <circle cx="190" cy="97" r="11" fill="url(#ph-lens)" stroke="#455b85" stroke-width="1.5"/>
    <circle cx="190" cy="97" r="7" fill="#06090f"/>
    <circle cx="188" cy="95" r="2.5" fill="#315CF5" opacity="0.8"/>
    <circle cx="189" cy="96" r="1" fill="#C7F36B"/>

    <!-- TrueTone Flash & LiDAR Sensor -->
    <circle cx="190" cy="74" r="4" fill="#fff3c4"/>
    <circle cx="190" cy="120" r="2.5" fill="#05070a"/>

    <!-- Frosted Glass Refraction Glare across body -->
    <path d="M 142 160 L 220 57 L 245 57 L 142 190 Z" fill="#ffffff" opacity="0.06"/>
    <path d="M 142 220 L 258 70 L 258 90 L 142 240 Z" fill="#ffffff" opacity="0.03"/>

    <!-- Minimalist Brand emblem on back -->
    <circle cx="200" cy="200" r="12" fill="none" stroke="#48608e" stroke-width="1.8" opacity="0.4"/>
    <path d="M 196 198 L 200 204 L 204 196" fill="none" stroke="#C7F36B" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>