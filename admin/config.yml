backend:
  name: git-gateway
  branch: main

media_folder: "images/products"
public_folder: "/images/products"

collections:
  - name: "catalog"
    label: "Catálogo de productos"
    files:
      - name: "products"
        label: "Productos de WorthIT"
        file: "content/products.json"
        format: "json"
        fields:
          - label: "Listado de productos"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.salePrice}}"
            fields:
              - { label: "ID interno", name: "id", widget: "string" }
              - { label: "Producto", name: "title", widget: "string" }
              - { label: "Categoría", name: "category", widget: "select", options: [{label: "Tecnología", value: "technology"}, {label: "Home Office", value: "home-office"}, {label: "Café", value: "coffee"}] }
              - { label: "Nombre visible de categoría", name: "categoryName", widget: "select", options: ["Tecnología", "Home Office", "Café"] }
              - { label: "Descripción breve", name: "shortDesc", widget: "text" }
              - { label: "Descripción completa", name: "fullDesc", widget: "text", required: false }
              - { label: "Precio anterior (ARS)", name: "originalPrice", widget: "number", value_type: "int", required: false }
              - { label: "Precio actual (ARS)", name: "salePrice", widget: "number", value_type: "int" }
              - { label: "Descuento (%)", name: "discount", widget: "number", value_type: "int", required: false }
              - { label: "Cuotas", name: "installments", widget: "string", required: false }
              - { label: "Imagen", name: "image", widget: "image" }
              - { label: "Enlace de afiliado", name: "affiliateUrl", widget: "string" }
              - { label: "Calificación", name: "rating", widget: "number", value_type: "float", required: false }
              - { label: "Cantidad de reseñas", name: "reviews", widget: "number", value_type: "int", required: false }
              - { label: "Mostrar en Spotlight", name: "featured", widget: "boolean", default: false }

  - name: "site_settings"
    label: "Contenidos de la página"
    files:
      - name: "general"
        label: "Textos, banners y suscripción"
        file: "content/settings.json"
        format: "json"
        fields:
          - { label: "Hero — primera línea", name: "heroTitleLine1", widget: "string" }
          - { label: "Hero — texto destacado", name: "heroTitleHighlight", widget: "string" }
          - { label: "Hero — cierre del título", name: "heroTitleSuffix", widget: "string" }
          - { label: "Hero — subtítulo", name: "heroSubtitle", widget: "text" }
          - { label: "Hero — activar cuenta regresiva", name: "countdownEnabled", widget: "boolean", default: false }
          - { label: "Cuenta regresiva — nombre del evento", name: "countdownEventName", widget: "string", required: false, hint: "Ej.: HOT SALE, CYBER MONDAY, Navidad" }
          - { label: "Cuenta regresiva — fecha de finalización", name: "countdownEndDate", widget: "date", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", required: false }
          - { label: "Cuenta regresiva — hora de finalización", name: "countdownEndTime", widget: "string", required: false, default: "23:59", hint: "Hora local de Argentina, formato 24 horas: HH:mm" }
          - { label: "Cuenta regresiva — encabezado", name: "countdownHeader", widget: "string", required: false }
          - { label: "Cuenta regresiva — mensaje al finalizar", name: "countdownExpiredMessage", widget: "string", required: false }
          - { label: "Barra superior — etiqueta", name: "announcementBadge", widget: "string" }
          - { label: "Barra superior — mensaje", name: "announcementText", widget: "string" }
          - { label: "Barra superior — cupón", name: "announcementCoupon", widget: "string" }
          - { label: "Catálogo — etiqueta", name: "catalogEyebrow", widget: "string" }
          - { label: "Catálogo — primera línea", name: "catalogTitleLine1", widget: "string" }
          - { label: "Catálogo — texto destacado", name: "catalogTitleHighlight", widget: "string" }
          - { label: "Catálogo — descripción", name: "catalogDescription", widget: "text" }
          - { label: "Newsletter — etiqueta", name: "newsletterBadge", widget: "string" }
          - { label: "Newsletter — título", name: "newsletterTitle", widget: "string" }
          - { label: "Newsletter — descripción", name: "newsletterDescription", widget: "text" }
          - { label: "Newsletter — aclaración", name: "newsletterDisclaimer", widget: "string" }
          - { label: "Footer — descripción", name: "footerBio", widget: "text" }
          - { label: "Footer — copyright", name: "footerCopyright", widget: "string" }
          - { label: "WhatsApp de soporte (con código de país)", name: "whatsappNumber", widget: "string", required: false }
